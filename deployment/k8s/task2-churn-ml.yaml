apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-risk-ml-service
  labels:
    app: churn-risk-ml-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-risk-ml-service
  template:
    metadata:
      labels:
        app: churn-risk-ml-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: ghcr.io/<github-username>/churn-risk-service:task2-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: MODEL_PATH
              value: /app/artifacts/churn_model.joblib
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: churn-risk-ml-service
  labels:
    app: churn-risk-ml-service
spec:
  selector:
    app: churn-risk-ml-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
